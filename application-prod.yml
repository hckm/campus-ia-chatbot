  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}

estabelecimento:
  site: https://www.renovomanipulacao.com.br/

logging:
  level:
    br.edu.usc.campusiachatbot: INFO
    org.hibernate.SQL: WARN
